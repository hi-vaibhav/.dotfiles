"$schema" = 'https://starship.rs/config-schema.json'

palette = 'catppuccin_frappe'

format ="""
$os\
$directory\
$git_branch\
$git_status\
$c\
$rust\
$golang\
$nodejs\
$php\
$java\
$kotlin\
$haskell\
$python\
$docker_context\
$cmd_duration\
\n$username\
$character\
"""

add_newline = false
command_timeout = 2000

[time]
disabled = false
time_format = "%R"
style = "bg:peach"
format = '[[🕥 $time](bold cyan)]($style)'

[cmd_duration]
min_time = 500
format = '[ ↕](bold cyan) [$duration](bold cyan)'

[username]
show_always = true
style_user = 'bold cyan'
style_root = 'bold red'
format = '[$user ]($style)'

[directory]
style ='bold purple'
read_only='🔒'
read_only_style='red'
format= '[$path]($style)[$read_only]($read_only_style)'
truncation_length = 1
truncation_symbol = '~/'
truncate_to_repo = false

[directory.substitutions]
'Documents' = '󰈙'
'documents' = '󰈙'
'Downloads' = ' '
'downloads' = ' '
'Music' = ' '
'music' = ' '
'Pictures' = ' '
'pictures' = ' '

[git_branch]
style = 'bold fg:blue'
symbol = ' '
format = '[ ↕](bold blue) [$symbol$branch]($style)'

[git_status]
format = '( [\[$all_status$ahead_behind\]]($style))'
deleted="X"

[character]
disabled = false
success_symbol ='[➜](bold fg:green)'
error_symbol = '[➜](bold fg:red)'
vimcmd_symbol = '[](bold fg:green)'
vimcmd_replace_one_symbol = '[](bold fg:purple)'
vimcmd_replace_symbol = '[](bold fg:purple)'
vimcmd_visual_symbol = '[](bold fg:lavender)'

[os]
disabled = false
style = "fg:red"

[os.symbols]
Windows = "󱄛 "
Ubuntu = "󰕈"
SUSE = ""
Raspbian = "󰐿"
Mint = "󰣭"
Macos = ""
Manjaro = ""
Linux = "󰌽"
Gentoo = "󰣨"
Fedora = "󰣛"
Alpine = ""
Amazon = ""
Android = ""
Arch = "󰣇"
Artix = "󰣇"
CentOS = ""
Debian = "󰣚"
Redhat = "󱄛"
RedHatEnterprise = "󱄛"

[nodejs]
symbol = ""
format = '[ ↕](bold green) [$symbol( $version)](bold green)'

[c]
symbol = " "
style = "bg:teal"
format = '[ ↕](bold teal) [ $symbol( $version)](bold teal)'

[rust]
symbol = ""
style = "bg:teal"
format = '[ ↕](bold teal) [ $symbol( $version)](bold teal)'

[golang]
symbol = ""
style = "bg:teal"
format = '[ ↕](bold teal) [ $symbol( $version)](bold teal)'

[php]
symbol = ""
style = "bg:teal"
format = '[ ↕](bold teal) [ $symbol( $version)](bold teal)'

[java]
symbol = " "
style = "bg:teal"
format = '[ ↕](bold teal) [ $symbol( $version)](bold teal)'

[kotlin]
symbol = ""
style = "bg:teal"
format = '[ ↕](bold teal) [ $symbol( $version)](bold teal)'

[haskell]
symbol = ""
style = "bg:teal"
format = '[ ↕](bold teal) [ $symbol( $version)](bold teal)'

[python]
symbol = ""
style = "bg:teal"
format = '[ ↕](bold teal) [ $symbol( $version)](bold teal)'

[docker_context]
symbol = ' '
style = 'fg:#06969A'
format = '[$symbol]($style) $path'
detect_files = ['docker-compose.yml', 'docker-compose.yaml', 'Dockerfile']
detect_extensions = ['Dockerfile']
[palettes.catppuccin_frappe]
rosewater = "#f2d5cf"
flamingo = "#eebebe"
pink = "#f4b8e4"
mauve = "#ca9ee6"
red = "#e78284"
maroon = "#ea999c"
peach = "#ef9f76"
yellow = "#e5c890"
green = "#a6d189"
teal = "#81c8be"
sky = "#99d1db"
sapphire = "#85c1dc"
blue = "#8caaee"
lavender = "#babbf1"
text = "#c6d0f5"
subtext1 = "#b5bfe2"
subtext0 = "#a5adce"
overlay2 = "#949cbb"
overlay1 = "#838ba7"
overlay0 = "#737994"
surface2 = "#626880"
surface1 = "#51576d"
surface0 = "#414559"
base = "#303446"
mantle = "#292c3c"
crust = "#232634"
